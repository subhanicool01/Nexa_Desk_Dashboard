name: Nexa-Desk-Dashboard
on:
    push:
        branches:
            - main
        paths:
            - 'src/**'
            - 'pom.xml'
            - 'Dockerfile'  
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize
            - reopened
    workflow_dispatch:
jobs:
    #----------Test jobs------------#
    test:    # this job id to refer another job.
      name: Run tests
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3
        - name: Setup java 21
          uses: actions/setup-java@v5
          with:
            java-version: '21'
            distribution: temurin
            cache: maven
        - name: Run Tests
          run: mvn test
        - name: Upload Test Reports
          uses: actions/upload-artifact@v4
          with:
            name: surefire-reports
            path: target/surefire-reports/
            retention-days: 3
    #-----------------Build the code-----------------#
    Build:
        name: Build code
        runs-on: ubuntu-latest
        needs: test
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - name: Setup-java
              uses: actions/setup-java@v5
              with:
                java-version: '21'
                distribution: tumurin
                cache: maven
            - name: Build and Package
              run: mvn package -DskipTests
            - name: Uploade Build artifacts
              uses: actions/upload-artifact@v4
              with:
                name: build-artifact
                path: target/*.jar   
                retention-days: 3             